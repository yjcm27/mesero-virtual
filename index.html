<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🍽️%3C/text%3E%3C/svg%3E">
<meta name="description" content="Mesero Virtual: prototipo de la interfaz del cliente para plazoletas de comidas.">
<meta name="theme-color" content="#1b1626">
<title>Mesero Virtual — Cliente</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Aquí se dibuja toda la interfaz con JavaScript -->
    <div id="app"></div>

    <!-- Aviso temporal (toast) -->
    <div id="toast" role="status" aria-live="polite"></div>

    <!-- Hoja inferior (modal) para producto, carrito, pago, etc. -->
    <div id="sh" class="bg hide" onclick="if(event.target===this)cl()">
        <div id="shc" class="sheet"></div>
    </div>

    <!-- Primero los datos y después la lógica -->
    <script src="js/datos.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
