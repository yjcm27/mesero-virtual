<style>
:root{--bg:#f6f2fb;--card:#fff;--line:#ddd3ec;--tx:#241b33;--mut:#6c6280;--acc:#d98200;--accx:#fff;--ok:#0f9d73;--blue:#2f6fd6;--red:#d6402f;--ll:block;--ld:none;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1626;--card:#262034;--line:#3a3250;--tx:#f4eefc;--mut:#a89fbd;--acc:#ffb020;--accx:#2a1c00;--ok:#4fd1a1;--blue:#6aa8ff;--red:#ff6b5e;--ll:none;--ld:block}}
:root[data-theme="dark"]{--bg:#1b1626;--card:#262034;--line:#3a3250;--tx:#f4eefc;--mut:#a89fbd;--acc:#ffb020;--accx:#2a1c00;--ok:#4fd1a1;--blue:#6aa8ff;--red:#ff6b5e;--ll:none;--ld:block}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{max-width:520px;margin:0 auto;padding:0 14px 140px}
h1{font-size:24px;font-weight:800;margin:8px 0 2px}h2{font-size:18px;margin:0}h3{font-size:16px;margin:0}
.mut{color:var(--mut);font-size:13px}.hide{display:none!important}.col{flex:1;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);display:flex;align-items:center;gap:10px;padding:8px 0}
.lg{width:auto;max-width:100%}.lg.l{display:var(--ll);mix-blend-mode:multiply}.lg.d{display:var(--ld);mix-blend-mode:screen}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.emo{width:60px;height:60px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:32px;flex:none}
.emo{overflow:hidden}.emo svg{width:100%;height:100%}.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.chips .chip{flex:none}
.btn{min-height:44px;padding:0 16px;border-radius:12px;background:var(--acc);color:var(--accx);font-weight:800}
.btn.alt{background:var(--bg);color:var(--tx);border:1px solid var(--line)}.btn.ok{background:var(--ok);color:#06241a}.btn.red{background:var(--red);color:#fff}
.btn.full{width:100%;margin-top:10px}.btn[disabled]{opacity:.45}.btn.demo{border:1px dashed var(--mut);background:none;color:var(--mut);min-height:36px;font-size:13px;font-weight:600}
.price{color:var(--acc);font-weight:800}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:800;border:1px solid currentColor}
.al{border:1px solid var(--red);border-radius:12px;padding:10px;margin:10px 0;font-size:13px}.al b{color:var(--red)}
.note{background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:10px;margin:10px 0;font-size:13px}
.steps{display:flex;justify-content:space-between;margin:12px 0 4px}.stp{flex:1;text-align:center;font-size:11px;color:var(--mut)}.stp i{display:block;height:6px;border-radius:3px;background:var(--line);margin:0 2px 4px}.stp.on{color:var(--tx)}.stp.on i{background:var(--acc)}
.qty{display:flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px}.qty button{width:40px;height:40px;font-size:20px;font-weight:800}.qty b{min-width:22px;text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-height:56px;font-size:12px;font-weight:600;color:var(--mut);position:relative}nav button span{display:block;font-size:22px}nav button.on{color:var(--acc)}
.bd{position:absolute;top:4px;left:calc(50% + 8px);background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:0 6px}
.fab{position:fixed;left:14px;right:14px;bottom:calc(68px + env(safe-area-inset-bottom,0px));max-width:492px;margin:0 auto;z-index:15;display:flex;justify-content:space-between;align-items:center;padding:0 18px;min-height:52px;box-shadow:0 8px 24px #0006}
.bg{position:fixed;inset:0;background:#000a;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
textarea{width:100%;min-height:70px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;padding:10px}
.chip{min-height:38px;padding:0 14px;border-radius:19px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px}.chip.on{background:var(--acc);color:var(--accx);border-color:var(--acc)}
.ring{font-size:64px;text-align:center;animation:sh .5s infinite alternate}@keyframes sh{to{transform:rotate(14deg)}}@media (prefers-reduced-motion:reduce){.ring{animation:none}}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

const lines=l=>(l.rm||[]).map(x=>`<div class="mut" style="color:var(--red);font-weight:800">SIN ${x.toLowerCase()}</div>`).join('')+(l.obs?`<div class="mut">Obs.: ${l.obs}</div>`:'');
function render(){
 const A=$('#app');
 if(!S.sess){A.innerHTML=welcome();return}
 const act=S.orders.filter(o=>!['Entregado','Cancelado'].includes(o.st)).length,c=S.carts[S.rid]||[],n=c.reduce((s,i)=>s+i.q,0);
 A.innerHTML=`<div class="top">${logo(38)}<div class="col"><b>Mesa 8</b><div class="mut">Sesión #${S.sess.n}</div></div><button class="btn alt" onclick="menu()" aria-label="Menú">⋯</button></div>`+
 (S.v==='orders'?vOrders():S.v==='menu'?vMenu():vRests())+
 (S.v==='menu'&&n?`<button class="btn fab" onclick="cart(${S.rid})"><span>🛒 Carrito (${n})</span><b>${M(c.reduce((s,i)=>s+i.p.$*i.q,0))}</b></button>`:'')+
 `<nav><button class="${S.v!=='orders'?'on':''}" onclick="S.v='rests';render()"><span>🍽️</span>Restaurantes</button><button class="${S.v==='orders'?'on':''}" onclick="S.v='orders';render()"><span>🧾</span>Mis pedidos${act?`<i class="bd">${act}</i>`:''}</button></nav>`;
}
function welcome(){return `<div style="text-align:center;padding-top:30px">${logo(150)}<h1>Mesero Virtual</h1>`+(S.closed?
 `<div class="card"><h3>Sesión cerrada</h3><p class="mut">Los pedidos en curso se entregan con normalidad. Para pedir de nuevo, escanea el QR de tu mesa.</p></div>`:
 `<p class="mut">Pide desde tu mesa, sin descargar nada.</p>`)+
 `<button class="btn full" onclick="scan()">📷 Simular escaneo del QR · Mesa 8</button><p class="mut">Cada escaneo crea una sesión nueva.</p></div>`}
function scan(){S.sess={n:++S.n,seq:{}};S.v='rests';S.closed=false;S.carts={};S.orders=[];render()}
function vRests(){return `<h1>¿Qué se te antoja hoy?</h1><p class="mut">Cada restaurante tiene su propio carrito y su propio pedido.</p>`+R.map(r=>{const n=(S.carts[r.id]||[]).reduce((s,i)=>s+i.q,0);
 return `<button class="card row" style="width:100%;text-align:left" onclick="S.rid=${r.id};S.cat='ALL';S.v='menu';render()"><div class="emo">${r.e}</div><div class="col"><h3>${r.n}</h3><div class="mut">${r.c}</div><div class="mut">${r.loc} · ⭐ ${r.r} · ⏱ ${r.tm}</div><div class="mut" style="margin-top:4px">${r.d}</div></div>${n?`<span class="tag" style="color:var(--acc)">🛒 ${n}</span>`:'<b style="color:var(--acc)">›</b>'}</button>`}).join('')}
function vMenu(){const r=R_(S.rid);return `<div class="row"><button class="btn alt" onclick="S.v='rests';render()" aria-label="Volver">←</button><h2>${r.n}</h2></div><div class="chips">${['ALL',...new Set(r.P.map(p=>p.c))].map(c=>`<button class="chip ${c===S.cat?'on':''}" onclick="S.cat='${c}';render()">${c==='ALL'?'Todo':c}</button>`).join('')}</div>`+r.P.filter(p=>S.cat==='ALL'||p.c===S.cat).map(p=>
 `<div class="card"><div class="row"><div class="emo">${pic(p).replace(/^<div class="emo">|<\/div>$/g,'')}</div><div class="col"><h3>${p.n}</h3><div class="mut">${p.d}</div><div class="mut" style="margin-top:2px">${p.al.length?'⚠ '+p.al.join(' · '):'Sin alérgenos declarados'}</div></div></div>
 <div class="row sp" style="margin-top:10px"><span class="price">${M(p.$)}</span>${p.x?'<span class="tag" style="color:var(--mut)">Agotado</span>':`<button class="btn" onclick="prod('${p.id}')">+ Agregar</button>`}</div></div>`).join('')}
function prod(id){const p=R_(S.rid).P.find(x=>x.id===id);S.t={p,q:1,rm:[],obs:''};ps()}
function ps(){const{p,q,rm}=S.t;sh(`<div class="row sp"><h2>${p.e} ${p.n}</h2><button class="btn alt" onclick="cl()" aria-label="Cerrar">✕</button></div>
 <h3 style="margin-top:12px">Ingredientes</h3>`+(p.m==='q'?p.i.map((x,k)=>`<label class="row" style="min-height:40px"><input type="checkbox" ${rm.includes(x)?'':'checked'} onchange="tg(${k},this.checked)"> ${x}</label>`).join('')+`<div class="mut">Desmarca lo que no quieras.</div>`:`<p class="mut">${p.i.join(' · ')}</p>`)+
 `<div class="al"><b>⚠ Alérgenos:</b> ${p.al.length?p.al.join(', '):'ninguno declarado'}.<br>Si tienes una alergia grave, confírmala con el restaurante.</div>`+
 (p.m!=='n'?`<h3>Observaciones</h3><textarea placeholder="Alergias, restricciones o peticiones especiales" oninput="S.t.obs=this.value">${S.t.obs}</textarea>`:'')+
 `<div class="row sp" style="margin-top:12px"><div class="qty"><button onclick="S.t.q=Math.max(1,S.t.q-1);ps()" aria-label="Menos">−</button><b>${q}</b><button onclick="S.t.q++;ps()" aria-label="Más">+</button></div><button class="btn col" onclick="addC()">Agregar · ${M(p.$*q)}</button></div>`)}
function tg(k,on){const x=S.t.p.i[k];S.t.rm=on?S.t.rm.filter(y=>y!==x):[...S.t.rm,x]}
function addC(){(S.carts[S.rid]=S.carts[S.rid]||[]).push({...S.t});cl();render()}
function cart(rid){const c=S.carts[rid]||[];if(!c.length){cl();return}const tot=c.reduce((s,i)=>s+i.p.$*i.q,0);
 sh(`<div class="row sp"><h2>Carrito · ${R_(rid).n}</h2><button class="btn alt" onclick="cl()" aria-label="Cerrar">✕</button></div>`+c.map((l,k)=>`<div class="card row sp"><div class="col"><h3>${l.p.n}</h3>${lines(l)}<span class="price">${M(l.p.$*l.q)}</span></div><div class="qty"><button onclick="cq(${rid},${k},-1)" aria-label="Menos">−</button><b>${l.q}</b><button onclick="cq(${rid},${k},1)" aria-label="Más">+</button></div></div>`).join('')+
 `<div class="row sp" style="margin-top:12px"><span class="mut">Entrega en Mesa 8</span><h2>${M(tot)}</h2></div><button class="btn full" onclick="pay(${rid},${tot})">Enviar a pagar</button>`)}
function cq(rid,k,d){const c=S.carts[rid];c[k].q+=d;if(c[k].q<=0)c.splice(k,1);render();cart(rid)}
function pay(rid,tot){sh(`<h2>Pago simulado</h2><p class="mut">Aquí irá el pago real. Por ahora, confirma la simulación para enviar tu pedido a ${R_(rid).n}.</p><div class="row sp"><span>Total</span><h2>${M(tot)}</h2></div><button class="btn full" onclick="place(${rid},${tot})">Confirmar pago (simulado)</button><button class="btn alt full" onclick="cart(${rid})">Volver al carrito</button>`)}
function place(rid,total){const q=S.sess.seq[rid]=(S.sess.seq[rid]||0)+1,o={id:++S.oid,rid,no:`${S.sess.n}-R${rid}-${String(q).padStart(2,'0')}`,items:S.carts[rid],total,st:'Enviando',t0:0,al:false};
 S.orders.push(o);S.carts[rid]=[];S.v='orders';cl();render()}
const est=o=>{const a=R_(o.rid).t+S.orders.filter(x=>x.rid===o.rid&&x.id<o.id&&['En espera','En preparación'].includes(x.st)).length*4;return `${a}–${a+4} min`};
function vOrders(){const L=[...S.orders].reverse(),live=S.orders.some(o=>!['Entregado','Cancelado'].includes(o.st));
 return `<h1>Mis pedidos</h1><p class="mut">Sesión #${S.sess.n} · cada restaurante tiene su pedido.</p>`+
 (S.plat==='ios'&&live?`<div class="note">🍎 Apple no permite enviar avisos sin instalar una app. Mantén esta página abierta y revisa el cronómetro; también verás tu pedido en la pantalla del restaurante.</div>`:'')+
 (L.length?L.map(o=>{const i=PATH.indexOf(o.st),w=['En espera','En preparación'].includes(o.st);return `<div class="card"><div class="row sp"><h3>#${o.no}</h3>${tag(o.st)}</div><div class="mut">${R_(o.rid).n} · ${M(o.total)}</div>
 <div style="margin-top:6px">${o.items.map(l=>`<div>${l.q}× ${l.p.n}${lines(l)}</div>`).join('')}</div>`+
 (i>=0?`<div class="steps">${PATH.map((s,k)=>`<div class="stp ${k<=i?'on':''}"><i></i>${s}</div>`).join('')}</div>`:'')+
 (w?`<div class="row sp"><span class="mut">Tiempo estimado: <b style="color:var(--tx)">${est(o)}</b></span><span class="mut">⏱ <b data-t="${o.t0}">0:00</b></span></div>`:'')+
 (o.st==='Enviando'?`<div class="mut">Esperando el comprobante de pago…</div><button class="btn demo full" onclick="adv(${o.id})">▶ Demo: llega el comprobante</button><button class="btn demo full" onclick="nopay(${o.id})">▶ Demo: pasan 5 min sin comprobante</button>`:'')+
 (o.st==='Pago no confirmado'?`<div class="note">No pudimos confirmar el pago. Puedes reintentar sin duplicar el pedido.</div><button class="btn full" onclick="retry(${o.id})">Reintentar pago</button>`:'')+
 (o.st==='En espera'?`<button class="btn alt full" onclick="cancel(${o.id})">Cancelar pedido</button>`:'')+
 (o.st==='Cancelado'?`<div class="mut">Reembolso pendiente.</div>`:'')+
 (o.st==='Listo'?`<div class="note" style="border-color:var(--ok)">✅ ¡Tu pedido está listo! Pasa por él al restaurante.</div>`:'')+
 (S.plat==='android'&&(w||o.st==='Enviando')?`<button class="btn ${o.al?'ok':'alt'} full" onclick="o_al(${o.id})">${o.al?'🔔 Aviso activado (se repite 2–3 veces, cada 30 s)':'🔔 Avísame cuando esté listo'}</button>`:'')+
 (w||o.st==='Listo'?`<button class="btn demo full" onclick="adv(${o.id})">▶ Demo: ${o.st==='En espera'?'cocina inicia producción':o.st==='En preparación'?'cocina termina el pedido':'mostrador entrega'}</button>`:'')+`</div>`}).join(''):
 `<div class="card" style="text-align:center"><div style="font-size:40px">🧾</div><p class="mut">Aún no tienes pedidos en esta sesión.</p></div>`)}
const ord=id=>S.orders.find(o=>o.id===id);
function adv(id){const o=ord(id);if(o.st==='Enviando'){o.st='En espera';o.t0=Date.now()}else{o.st=PATH[PATH.indexOf(o.st)+1];if(o.st==='Listo')ring(o)}render()}
function nopay(id){ord(id).st='Pago no confirmado';render()}
function retry(id){const o=ord(id);o.st='Enviando';render()}
function cancel(id){sh(`<h2>¿Cancelar el pedido?</h2><p class="mut">Solo puedes cancelar antes de que cocina inicie la producción.</p><button class="btn red full" onclick="ord(${id}).st='Cancelado';cl();render()">Sí, cancelar</button><button class="btn alt full" onclick="cl()">No, mantenerlo</button>`)}
function o_al(id){const o=ord(id);o.al=!o.al;render()}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),g=c.createGain();g.connect(c.destination);[0,.25,.5].forEach(d=>{const x=c.createOscillator();x.frequency.value=1100;x.connect(g);g.gain.setValueAtTime(.25,c.currentTime+d);g.gain.setValueAtTime(0,c.currentTime+d+.15);x.start(c.currentTime+d);x.stop(c.currentTime+d+.16)})}catch(e){}}
function ring(o){const go=()=>{beep();if(S.plat==='android'&&navigator.vibrate)navigator.vibrate([200,100,200])};go();clearInterval(S.al);S.al=setInterval(go,1800);
 sh(`<div class="ring">🔔</div><h2 style="text-align:center">¡Tu pedido #${o.no} está listo!</h2><p class="mut" style="text-align:center">${R_(o.rid).n} · pasa por él mientras está caliente.</p><button class="btn ok full" onclick="stop()">Entendido, ya voy por él</button>`)}
function stop(){clearInterval(S.al);cl()}
function menu(){sh(`<div class="row sp"><h2>Mesa 8 · Sesión #${S.sess.n}</h2><button class="btn alt" onclick="cl()" aria-label="Cerrar">✕</button></div>
 <h3 style="margin-top:12px">Tu teléfono (demo)</h3><div class="row" style="margin-top:8px"><button class="chip ${S.plat==='android'?'on':''}" onclick="S.plat='android';render();menu()">Android</button><button class="chip ${S.plat==='ios'?'on':''}" onclick="S.plat='ios';render();menu()">iPhone</button></div>
 <button class="btn demo full" onclick="idle()">▶ Demo: 50 min sin actividad</button><button class="btn red full" onclick="end()">Terminé</button>`)}
function idle(){sh(`<h2>¿Sigues ahí?</h2><p class="mut">Por inactividad, tu sesión se cerrará en 10 minutos. Los pedidos en curso no se cancelan.</p><button class="btn full" onclick="cl()">Sigo aquí</button><button class="btn alt full" onclick="end()">Terminé</button>`)}
function end(){sh(`<h2>¿Cerrar la sesión?</h2><p class="mut">Los pedidos en curso se entregan con normalidad, pero no podrás pedir más. Para pedir de nuevo tendrás que escanear el QR.</p><button class="btn red full" onclick="S.sess=null;S.closed=true;cl();render()">Sí, terminé</button><button class="btn alt full" onclick="cl()">Volver</button>`)}
setInterval(()=>document.querySelectorAll('[data-t]').forEach(e=>{const s=Math.max(0,Math.floor((Date.now()-e.dataset.t)/1000));e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}),1000);
render();
</script></body></html>
