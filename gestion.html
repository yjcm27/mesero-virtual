<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1626">
<title>Mesero Virtual — Gestión del menú</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  label.f { display: block; margin: 12px 0 4px; font-weight: 600; }
  input[type=text], input[type=number], select { width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--tx); font: inherit; padding: 8px 12px; }
  .g { display: flex; flex-wrap: wrap; gap: 8px; }
  .g label { display: flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 19px; background: var(--card); font-size: 13px; font-weight: 600; }
  .acc { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .acc .btn { min-height: 38px; font-size: 13px; padding: 0 12px; }
  input[type=file] { width: 100%; padding: 8px 0; font: inherit; color: var(--tx); }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <img class="lg l" alt="Mesero Virtual" style="height:38px" src="img/logo-claro.png">
    <img class="lg d" alt="" style="height:38px" src="img/logo-oscuro.png">
    <div class="col"><b>Gestión del menú</b><div class="mut">Panel del restaurante</div></div>
    <a class="btn alt" style="display:grid;place-items:center;text-decoration:none" href="cliente.html">Ver cliente</a>
  </div>

  <label class="f" for="rest">Restaurante</label>
  <select id="rest"></select>

  <!-- FORMULARIO: sirve para crear y para editar -->
  <form id="form" class="card" novalidate>
    <h2 id="titulo">Nuevo producto</h2>
    <label class="f" for="f-n">Nombre</label><input type="text" id="f-n" maxlength="60" autocomplete="off">
    <label class="f" for="f-img">Foto del platillo (opcional)</label>
    <input type="file" id="f-img" accept="image/jpeg,image/png,image/webp">
    <div class="mut">JPG, PNG o WebP. Se reduce sola para que cargue rápido.</div>
    <div id="prevbox" class="hide" style="margin-top:8px">
      <img id="prev" alt="Vista previa de la foto" style="width:100%;max-height:200px;object-fit:cover;border-radius:12px">
      <button type="button" class="btn alt full" id="quitar">Quitar foto</button>
    </div>
    <label class="f" for="f-e">Emoji (se usa si no hay foto)</label><input type="text" id="f-e" maxlength="4" placeholder="🍽️">
    <label class="f" for="f-c">Categoría</label><input type="text" id="f-c" maxlength="30" list="cats" autocomplete="off"><datalist id="cats"></datalist>
    <label class="f" for="f-p">Precio (COP)</label><input type="number" id="f-p" min="1" step="1" inputmode="numeric">
    <label class="f" for="f-d">Descripción</label><textarea id="f-d" maxlength="140"></textarea>
    <label class="f" for="f-i">Ingredientes (separados por coma)</label><input type="text" id="f-i" autocomplete="off" placeholder="Pan, Carne, Queso">
    <label class="f">Alérgenos (obligatorio)</label>
    <div class="g" id="alerg"></div>
    <label class="f" for="f-m">Personalización</label>
    <select id="f-m">
      <option value="q">Ingredientes quitables</option>
      <option value="o">Solo observaciones</option>
      <option value="n">Sin personalización</option>
    </select>
    <label class="row ack"><input type="checkbox" id="f-x"> Producto agotado</label>
    <label class="row ack"><input type="checkbox" id="f-ack"> Declaro que la lista de alérgenos es correcta y completa. La responsabilidad es de mi restaurante.</label>
    <div id="er" class="err" role="alert"></div>
    <button class="btn full" type="submit" id="guardar">Guardar producto</button>
    <button class="btn alt full hide" type="button" id="cancelar">Cancelar edición</button>
  </form>

  <!-- LISTA: aquí se ven, editan y eliminan los productos -->
  <div class="row sp"><h2>Productos <span class="mut" id="cuenta"></span></h2></div>
  <input type="text" id="q" placeholder="Buscar producto…" aria-label="Buscar producto" style="margin-top:8px">
  <div id="lista"></div>
  <button class="btn alt full" id="reiniciar">Restaurar datos de ejemplo</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="js/datos.js"></script>
<script src="js/almacen.js"></script>
<script src="js/gestion.js"></script>
</body>
</html>
