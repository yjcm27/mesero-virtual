<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1626">
<title>Mesero Virtual — Cocina</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  #app { max-width: 720px; }
  select { width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--tx); font: inherit; padding: 8px 12px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 4px; }
  .chips .chip { flex: none; }
  .btn[disabled] { opacity: .45; }
  .it { padding: 8px 0; border-top: 1px solid var(--line); font-size: 16px; }
  .sin { color: var(--red); font-weight: 800; font-size: 15px; }
  .obs { background: #ffd54a; color: #2a1c00; border: 3px solid #ff9800; border-radius: 10px; padding: 8px 10px; margin: 6px 0; font-size: 17px; font-weight: 800; }
  .conobs { border-color: #ff9800; border-width: 2px; }
  .leida { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-top: 8px; font-weight: 800; color: #ff9800; }
  .leida input { width: 22px; height: 22px; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <img class="lg l" alt="Mesero Virtual" style="height:38px" src="img/logo-claro.png">
    <img class="lg d" alt="" style="height:38px" src="img/logo-oscuro.png">
    <div class="col"><b>Cocina</b><div class="mut">Pedidos pagados, en orden de llegada</div></div>
    <a class="btn alt" style="display:grid;place-items:center;text-decoration:none" href="index.html">Cliente</a>
  </div>
  <label for="rest" class="mut">Restaurante</label>
  <select id="rest"></select>
  <div class="chips" id="tabs"></div>
  <div id="lista"></div>
  <button class="btn alt full" id="limpiar">Borrar todos los pedidos (demo)</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="js/datos.js"></script>
<script src="js/almacen.js"></script>
<script src="js/cocina.js"></script>
</body>
</html>
